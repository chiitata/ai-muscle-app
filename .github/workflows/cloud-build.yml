name: Android Build Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle wrapper jar
        run: |
          mkdir -p gradle/wrapper
          cd gradle/wrapper
          echo "Downloading Gradle wrapper..."
          wget https://repo.gradle.org/gradle/distributions/gradle-8.2-bin.zip || (echo "wget failed, trying curl" && curl -L -o gradle-8.2-bin.zip https://repo.gradle.org/gradle/distributions/gradle-8.2-bin.zip)
          echo "Extracting..."
          unzip gradle-8.2-bin.zip || exit 1
          echo "Copying wrapper jar..."
          ls -la gradle-8.2/lib/
          cp gradle-8.2/lib/gradle-wrapper.jar . || exit 1
          rm -rf gradle-8.2 gradle-8.2-bin.zip
          ls -la
          cd ../..

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease -x test

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: List build outputs
        if: always()
        run: ls -lh app/build/outputs/apk/release/

      - name: Build success notification
        if: success()
        run: echo "✅ APK build successful!"

      - name: Build failure notification
        if: failure()
        run: |
          echo "❌ Build failed"
          exit 1
