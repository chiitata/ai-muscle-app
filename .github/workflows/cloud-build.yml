name: Android Build Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew || echo "gradlew not found yet, will be created by gradle init"

      - name: Build release APK
        run: ./gradlew assembleRelease -x test

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: List build outputs
        if: always()
        run: ls -lh app/build/outputs/apk/release/

      - name: Build success notification
        if: success()
        run: echo "✅ APK build successful!"

      - name: Build failure notification
        if: failure()
        run: |
          echo "❌ Build failed"
          exit 1
