name: Android Build Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Reinstall Gradle wrapper
        run: |
          echo "Downloading gradle-8.2-all.zip..."
          curl -L -o gradle-8.2-all.zip https://services.gradle.org/distributions/gradle-8.2-all.zip
          echo "Extracting gradle distribution..."
          unzip -q gradle-8.2-all.zip
          echo "Running gradle wrapper from distribution..."
          ./gradle-8.2/bin/gradle wrapper --gradle-version 8.2 --distribution-type bin 2>&1 || true
          echo "Cleaning up gradle distribution directory..."
          rm -rf gradle-8.2 gradle-8.2-all.zip .gradle
          echo "Gradle wrapper installed!"
          ls -lah gradle/wrapper/

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease -x test

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: List build outputs
        if: always()
        run: ls -lh app/build/outputs/apk/release/

      - name: Build success notification
        if: success()
        run: echo "✅ APK build successful!"

      - name: Build failure notification
        if: failure()
        run: |
          echo "❌ Build failed"
          exit 1
