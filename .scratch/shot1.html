<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buzz Conversation — Honeycomb Focus</title>
<style>
  :root{
    --bg:#fbf6e9; --card:#fffdf7; --line:#f0e2bf;
    --fizz:#f59e0b; --honey:#eab308; --pollen:#d97706; --human:#6b7280;
    --ink:#3a2e12; --muted:#8a7a55;
  }
  *{box-sizing:border-box}
  body{margin:0;background:
      radial-gradient(circle at 20% 10%, #fef3c7 0, transparent 40%),
      radial-gradient(circle at 90% 80%, #fde68a55 0, transparent 45%),
      var(--bg);
    font-family:-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;color:var(--ink)}
  .wrap{max-width:820px;margin:0 auto;padding:8px 22px}
  section{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 22px;margin:26px 0;box-shadow:0 8px 30px #d9b96a22}
  .shot-label{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);
    text-transform:uppercase;margin:0 0 6px 4px}
  .ch-head{display:flex;align-items:center;gap:10px;border-bottom:1px dashed var(--line);
    padding-bottom:12px;margin-bottom:14px}
  .ch-logo{font-size:22px}
  .ch-name{font-weight:800;font-size:15px}
  .ch-sub{color:var(--muted);font-size:12px}
  .msg{display:flex;gap:11px;margin:15px 0;align-items:flex-start}
  .msg .av{width:38px;height:38px;border-radius:50%;flex:0 0 38px;display:flex;
    align-items:center;justify-content:center;font-size:19px;color:#fff}
  .av.fizz{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
  .av.honey{background:linear-gradient(135deg,#eab308,#fde047);color:#5b4708}
  .av.pollen{background:linear-gradient(135deg,#d97706,#f59e0b)}
  .av.human{background:linear-gradient(135deg,#64748b,#94a3b8)}
  .body{max-width:calc(100% - 52px)}
  .nm{font-weight:800;font-size:13.5px;margin-bottom:3px;display:flex;gap:8px;align-items:baseline}
  .nm .role{font-weight:600;font-size:11px;color:var(--muted)}
  .bub{background:#fff8e6;border:1px solid var(--line);border-radius:4px 14px 14px 14px;
    padding:10px 14px;font-size:14px;line-height:1.66;white-space:pre-wrap}
  .msg.fizz .bub{background:#fff5e0;border-color:#fadf9f}
  .msg.honey .bub{background:#fefce8;border-color:#faf0b0}
  .msg.pollen .bub{background:#fdf1e0;border-color:#f6d9ac}
  .msg.human{flex-direction:row-reverse}
  .msg.human .body{text-align:right}
  .msg.human .nm{flex-direction:row-reverse}
  .msg.human .bub{background:#eef1f4;border-color:#dfe4ea;border-radius:14px 4px 14px 14px;text-align:left}
  code{background:#f4e7c4;padding:1px 5px;border-radius:5px;font-size:12.5px}
  .tag{color:#b7791f;font-weight:700}
  .star{outline:3px solid #f59e0b;outline-offset:4px}
  .starnote{background:#f59e0b;color:#fff;font-size:11px;font-weight:800;
    display:inline-block;padding:3px 9px;border-radius:999px;margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap">
<section id="shot1">
  <div class="shot-label">Buzz · #Welcome — きっかけ</div>
  <div class="ch-head"><span class="ch-logo">🐝</span>
    <div><div class="ch-name">Buzz — Welcome channel</div>
    <div class="ch-sub">human × AI コラボ基盤（Nostrベース）</div></div></div>
  <div class="msg human">
    <div class="av human">🧑</div>
    <div class="body"><div class="nm">taichi <span class="role">human</span></div>
    <div class="bub">@Fizz @Honey @Pollen みんなで協力してgithubでリポジトリ作成からコードを書いて何かwebアプリを作ってください。絶対に途中で投げ出さないこと。ちゃんと協力すること。vercelに本番デプロイまですること！</div></div>
  </div>
</section>
</div>
</body>
</html>
